version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: gov-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gov_unified
      POSTGRES_USER: gov_admin
      POSTGRES_PASSWORD: gov_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/core/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gov_admin -d gov_unified"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: gov-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-04-18T19-09-19Z
    container_name: gov-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gov-api
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: postgres://gov_admin:gov_secure_password_2026@postgres:5432/gov_unified
      REDIS_URL: redis://redis:6379
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadminpassword
      STORAGE_BUCKET: gov-documents
      JWT_SECRET: super-secret-gov-jwt-access-token-key-32chars
      JWT_REFRESH_SECRET: super-secret-gov-jwt-refresh-token-key-32chars
      ENCRYPTION_MASTER_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      HMAC_SECRET: gov-cross-department-hmac-secret-key-32chars
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["npm", "run", "start:api"]

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gov-worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://gov_admin:gov_secure_password_2026@postgres:5432/gov_unified
      REDIS_URL: redis://redis:6379
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadminpassword
      STORAGE_BUCKET: gov-documents
      JWT_SECRET: super-secret-gov-jwt-access-token-key-32chars
      ENCRYPTION_MASTER_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      HMAC_SECRET: gov-cross-department-hmac-secret-key-32chars
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["npm", "run", "start:worker"]

volumes:
  postgres_data:
  redis_data:
  minio_data:
